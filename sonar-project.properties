# sonar-project.properties
# Lives in the ROOT of the 8.2CDevSecOps repository (next to package.json).

sonar.projectKey=voldemort07_8.2CDevSecOps
sonar.organization=voldemort07
sonar.host.url=https://sonarcloud.io

# The token is deliberately NOT stored here. A .properties file does not expand
# environment variables, and committing a secret to GitHub would be poor practice.
# It is injected by Jenkins at run time via -Dsonar.token=%SONAR_TOKEN%.

sonar.sources=.
sonar.exclusions=node_modules/**,test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.projectName=NodeJS Goof Vulnerable App
sonar.sourceEncoding=UTF-8
